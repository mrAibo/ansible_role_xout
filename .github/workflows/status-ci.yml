name: Status CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ansible-core
        run: python -m pip install --disable-pip-version-check -q "ansible-core>=2.15,<2.20"
      - name: Validate dedicated status and final postcheck syntax
        shell: bash
        run: |
          set -euo pipefail
          ansible-playbook \
            --syntax-check \
            -i tests/ci_inventory.ini \
            xout_status.yml \
            -e xout_manage_pegasus=false \
            -e "xout_manager_path=$PWD/tests/fake_xmanager.py"
          ansible-playbook \
            --syntax-check \
            -i tests/ci_inventory.ini \
            xout_postcheck.yml \
            -e xout_force_consolidated_postcheck=true \
            -e xout_manage_pegasus=false \
            -e xout_check_cups=false \
            -e "xout_manager_path=$PWD/tests/fake_xmanager.py"
      - name: Execute compact parallel status acceptance test
        shell: bash
        run: |
          set -euo pipefail
          export ANSIBLE_STDOUT_CALLBACK=xout_compact
          export ANSIBLE_CALLBACK_PLUGINS="$PWD/callback_plugins"
          ansible-playbook \
            -i tests/ci_inventory.ini \
            xout_status.yml \
            -e xout_manage_pegasus=false \
            -e "xout_manager_path=$PWD/tests/fake_xmanager.py" \
            >/tmp/status.txt
          grep -q 'XOUT STATUS - CI_TEST' /tmp/status.txt
          grep -q 'Pegasus.*NOT MANAGED' /tmp/status.txt
          grep -q '^RESULT$' /tmp/status.txt
          grep -q '^  SUCCESS$' /tmp/status.txt
          ! grep -q '^TASK \\[' /tmp/status.txt
      - name: Execute consolidated final postcheck acceptance test
        shell: bash
        run: |
          set -euo pipefail
          export ANSIBLE_STDOUT_CALLBACK=xout_compact
          export ANSIBLE_CALLBACK_PLUGINS="$PWD/callback_plugins"
          ansible-playbook \
            -i tests/ci_inventory.ini \
            xout_postcheck.yml \
            -e xout_force_consolidated_postcheck=true \
            -e xout_manage_pegasus=false \
            -e xout_check_cups=false \
            -e "xout_manager_path=$PWD/tests/fake_xmanager.py" \
            >/tmp/postcheck.txt
          grep -q 'XOUT STATUS - CI_TEST' /tmp/postcheck.txt
          grep -q 'xout-batchsplitter.*\[ALLOWED\]' /tmp/postcheck.txt
          grep -q 'Portal/Jolokia.*OK' /tmp/postcheck.txt
          grep -q 'XOUT postcheck passed:' /tmp/postcheck.txt
          grep -q '^RESULT$' /tmp/postcheck.txt
          grep -q '^  SUCCESS$' /tmp/postcheck.txt
