name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  xmanager:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile xmanager
        run: python -m py_compile xmanager.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_xmanager.py' -v
      - name: Verify CLI help
        run: |
          python xmanager.py --version
          python xmanager.py --help >/dev/null
          python xmanager.py package-plan --help >/dev/null
          python xmanager.py package-apply --help >/dev/null
          python xmanager.py modules-quiesce --help >/dev/null
          python xmanager.py modules-restore --help >/dev/null

  ansible:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ansible-core
        run: python -m pip install --disable-pip-version-check -q "ansible-core>=2.15,<2.20"
      - name: Install ServiceFlow from tested main branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p collections
          ansible-galaxy collection install \
            "git+https://github.com/mrAibo/ansible_serviceflow.git,main" \
            -p collections --force
      - name: Validate wrapper syntax, component option and interactive multi-selection
        shell: bash
        run: |
          set -euo pipefail
          bash -n xoutctl
          ./xoutctl --help >/tmp/xoutctl-help.txt
          grep -q -- '--component COMPONENT' /tmp/xoutctl-help.txt
          printf '1,4,5\n1\n' | ANSIBLE_PLAYBOOK=/bin/true ./xoutctl >/tmp/xoutctl-menu.txt
          grep -q -- '- HB_TEST (HB_TEST_XOUT.ini)' /tmp/xoutctl-menu.txt
          grep -q -- '- NDS_TEST (NDS_TEST_XOUT.ini)' /tmp/xoutctl-menu.txt
          grep -q -- '- NDS_MIGRATION (NDS_MIG_XOUT.ini)' /tmp/xoutctl-menu.txt
          grep -q 'Action       : status' /tmp/xoutctl-menu.txt
          ANSIBLE_PLAYBOOK=/bin/true ./xoutctl NDS_TEST plan --component web >/tmp/xoutctl-component.txt
          grep -q 'Component    : web' /tmp/xoutctl-component.txt
          grep -q 'xout_component=web' /tmp/xoutctl-component.txt
      - name: Validate inventories and playbook syntax
        shell: bash
        run: |
          set -euo pipefail
          export ANSIBLE_COLLECTIONS_PATH="$PWD/collections"
          export ANSIBLE_ROLES_PATH="$PWD"
          for inventory in \
            HB_TEST_XOUT.ini \
            HB_MIG_XOUT.ini \
            HB_PROD_XOUT.ini \
            NDS_TEST_XOUT.ini \
            NDS_MIG_XOUT.ini \
            NDS_PROD_XOUT.ini; do
            echo "== $inventory =="
            ansible-inventory -i "$inventory" --list >/dev/null
            ansible-playbook \
              --syntax-check \
              -i "$inventory" \
              xout_update_role.yml \
              -e xout_properties_file=
          done
      - name: Execute controller-side plan acceptance tests
        shell: bash
        run: |
          set -euo pipefail
          export ANSIBLE_COLLECTIONS_PATH="$PWD/collections"
          export ANSIBLE_ROLES_PATH="$PWD"
          ansible-playbook \
            -i tests/ci_inventory.ini \
            xout_update_role.yml \
            -e xout_action=plan \
            -e "xout_manager_path=$PWD/tests/fake_xmanager.py" \
            -e xout_properties_file= \
            -e xout_check_udu=false \
            -e xout_show_plan=true \
            >/tmp/full-plan.txt
          grep -q 'Scope: full environment' /tmp/full-plan.txt
          grep -q '1. modeshape -> ci_modeshape' /tmp/full-plan.txt
          grep -q '5. web -> ci_web1, ci_portal2' /tmp/full-plan.txt

          ansible-playbook \
            -i tests/ci_inventory.ini \
            xout_update_role.yml \
            -e xout_action=plan \
            -e xout_component=web \
            -e "xout_manager_path=$PWD/tests/fake_xmanager.py" \
            -e xout_properties_file= \
            -e xout_check_udu=false \
            -e xout_show_plan=true \
            >/tmp/component-plan.txt
          grep -q 'Scope: component web' /tmp/component-plan.txt
          grep -q 'ci_web1' /tmp/component-plan.txt
          grep -q 'ci_portal2' /tmp/component-plan.txt
          ! grep -q 'ci_modeshape' /tmp/component-plan.txt
          grep -q '1. web -> ci_web1, ci_portal2' /tmp/component-plan.txt
