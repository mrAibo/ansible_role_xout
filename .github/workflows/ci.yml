name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  xmanager:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile xmanager
        run: python -m py_compile xmanager.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify CLI help
        run: |
          python xmanager.py --version
          python xmanager.py --help >/dev/null
          python xmanager.py package-plan --help >/dev/null
          python xmanager.py package-apply --help >/dev/null
