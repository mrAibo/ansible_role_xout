---
- name: Start XOUT services in dependency order
  block:
    - name: Execute ordered XOUT start
      ansible.builtin.include_role:
        name: mraibo.serviceflow.lifecycle
      vars:
        serviceflow_action: start
        serviceflow_services: "{{ xout_serviceflow_services }}"
        serviceflow_parallel_hosts: "{{ xout_parallel_hosts | bool }}"
        serviceflow_parallel_timeout: "{{ xout_serviceflow_parallel_timeout | int }}"
        serviceflow_become: "{{ xout_serviceflow_become | bool }}"
        serviceflow_show_plan: "{{ xout_show_plan | bool }}"
  rescue:
    - name: Return partially started environment to DOWN state
      ansible.builtin.include_role:
        name: mraibo.serviceflow.lifecycle
      vars:
        serviceflow_action: stop
        serviceflow_services: "{{ xout_serviceflow_services }}"
        serviceflow_parallel_hosts: "{{ xout_parallel_hosts | bool }}"
        serviceflow_parallel_timeout: "{{ xout_serviceflow_parallel_timeout | int }}"
        serviceflow_become: "{{ xout_serviceflow_become | bool }}"
        serviceflow_show_plan: false

    - name: Report failed XOUT start
      ansible.builtin.fail:
        msg: >-
          XOUT start/readiness failed. ServiceFlow returned the environment to
          DOWN state. Portal module state and Pegasus state are intentionally
          left for a later recovery start.
