---
- name: Read XOUT status from every host
  ansible.builtin.command:
    argv:
      - "{{ xout_python_path }}"
      - "{{ xout_manager_path }}"
      - --json
      - list
  delegate_to: "{{ item }}"
  loop: "{{ xout_target_hosts }}"
  loop_control:
    label: "{{ item }}"
  changed_when: false
  register: xout_status_results

- name: Initialize Pegasus status label
  ansible.builtin.set_fact:
    xout_status_pegasus_label: >-
      {{ 'UNKNOWN' if xout_manage_pegasus | bool else 'NOT MANAGED' }}

- name: Read managed Pegasus status
  ansible.builtin.include_tasks: status_pegasus.yml
  when:
    - xout_manage_pegasus | bool
    - xout_oracle_hosts | length == 1

- name: Display environment status
  ansible.builtin.debug:
    msg: |-
      XOUT STATUS - {{ xout_effective_environment }}
      {% for result in xout_status_results.results %}

      {{ result.item }}
      {% for service in result.stdout | from_json %}
        {{ '%-27s' | format(service.name) }} {{ '%-10s' | format(service.active) }} enabled={{ service.enabled }} version={{ service.version }}
      {% endfor %}
      {% endfor %}

      Pegasus                     {{ xout_status_pegasus_label }}
