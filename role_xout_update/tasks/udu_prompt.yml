---
- name: Wait for manual UDU installation confirmation
  ansible.builtin.pause:
    prompt: >-
      UDU update found at
      {{ xout_udu_root }}/Auslieferung_{{ xout_udu_version }}/{{ xout_effective_kasse }}/udu.
      XOUT is stopped. Install the UDU manually, then press Enter to continue.
  when: xout_udu_required | default(false) | bool
