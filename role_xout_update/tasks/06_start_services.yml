- name: Start XOUT services (group-based)
  ansible.builtin.shell: "sudo /usr/bin/systemctl start {{ item.service }}"
  loop:
    - { group: "web",       service: "xout-web" }
    - { group: "tobi",      service: "xout-web" }
    - { group: "portal",    service: "xout-portal" }
    - { group: "pmc",       service: "xout-pmc" }
    - { group: "activemq",  service: "xout-activemq-artemis" }
  loop_control:
    label: "{{ item.group }} - {{ item.service }}"
  #vars:
    #unit: "{{ item.service }}.service"
  when:
    - item.group in group_names
    #- ansible_facts.get('services', {}).get(unit, {}).get('state') == 'stopped'
    # - ansible_facts.get('services', {}).get(unit, {}).get('status') == 'enabled'
  tags: xout_start

- name: Disable XOUT services (group-based)
  ansible.builtin.shell: "sudo /usr/bin/systemctl disable {{ item.service }}"
  loop:
    - { group: "web",       service: "xout-web" }
    - { group: "tobi",      service: "xout-web" }
    - { group: "portal",    service: "xout-portal" }
    - { group: "pmc",       service: "xout-pmc" }
    - { group: "activemq",  service: "xout-activemq-artemis" }
    - { group: "modeshape", service: "xout-modeshape" }
  loop_control:
    label: "{{ item.service }}"
  #vars:
    #unit: "{{ item.service }}.service"
  when:
    - item.group in group_names
    # - ansible_facts.get('services', {}).get(unit, {}).get('state') == 'stopped'
    #- ansible_facts.get('services', {}).get(unit, {}).get('status') == 'enabled'
  tags: xout_start
