---
- name: Gather service_facts
  service_facts:
  when: "'modeshape' in group_names"
  tags: xout_start

- name: DEBUG
  debug:
    var: ansible_facts.services['xout-modeshape.service']
  when: "'modeshape' in group_names"
  tags: xout_start
# - name: Start xout-modeshape service
  # systemd:
    # name: xout-modeshape
    # state: started
  # when: "'modeshape' in group_names"
  # register: modeshape_systemd_status
  # tags: xout_start

- name: Check state of ModeShape Service
  shell: systemctl is-active xout-modeshape
  register: modeshape_systemd_status
  when: "'modeshape' in group_names"
  tags: xout_start

- name: Entferne Zeile aus einer server.log
  ansible.builtin.lineinfile:
    path: /var/log/xout/modeshape/server.log
    regexp: '^.*Started ModeShapeServer in.*$'
    state: absent
  when: "'modeshape' in group_names and modeshape_systemd_status.stdout == 'inactive'"
  tags: xout_start

# - name: Start xout-modeshape service
  # systemd:
    # name: xout-modeshape
    # state: started
  # when: "'modeshape' in group_names"
  # register: modeshape_systemd_status
  # tags: xout_start

- name: Start XOUT ModeShape Systemd Service
  shell: "sudo /usr/bin/systemctl start xout-modeshape.service"
  when: "'modeshape' in group_names and modeshape_systemd_status.stdout == 'inactive'"
  register: modeshape_service_status
  tags: xout_start

- name: ModeShape Service State
  debug:
    var: modeshape_systemd_status.stdout 
  when: "'modeshape' in group_names"
  tags: xout_start

- name: Wait for 'Started ModeShapeServer' message in server.log
  wait_for:
    path: /var/log/xout/modeshape/server.log
    search_regex: 'Started ModeShapeServer in'
  when: "'modeshape' in group_names and modeshape_systemd_status.stdout == 'inactive'"
  tags: xout_start



