- name: Stop Pegasus (Druck Client)
  include_tasks: 00_execute_sql.yml
  vars:
   sql_query: "update pegasus_plugins set active=0 where TYPE=4"
  run_once: true
  tags: 
    - xout_stop
    - pegasus_stop

# - name: Package Fakten sammeln
