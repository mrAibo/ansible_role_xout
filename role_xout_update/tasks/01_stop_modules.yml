- name: Fetch JSON Data from XOUT-Portal URL
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:5000/jolokia/read/portal.server.modules:*/CurrentModuleInformation"
    method: GET
    return_content: yes
  register: json_response
  when: "'portal' in group_names"
  tags: xout_stop

- name: Extract Modules Information from XOUT-Portal
  ansible.builtin.set_fact:
    modules: "{{ json_response.json.value }}"
  when: "'portal' in group_names"
  tags: xout_stop

- name: Stop Import, Router, Merger Modules
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:5000/jolokia/"
    method: POST
    headers:
      Content-Type: "text/plain"
    body_format: json
    body: "{{ '{\"mbean\": \"portal.server.modules:module=\\\"' + item.key.split('=')[1] | replace('\"', '') + '\\\"\", \"arguments\": [\"localhost/127.0.0.1\"], \"type\": \"EXEC\", \"operation\": \"stopModule\"}' }}"
  loop: "{{ modules | dict2items }}"
  when: >
    'portal' in group_names and 
    item.value.CurrentModuleInformation.state == 'RUNNING' and
    (
      'import' in item.key.split('=')[1].lower() or
      'router' in item.key.split('=')[1].lower() or
      'merger' in item.key.split('=')[1].lower() 
    )
  loop_control:
    label: "{{ item.key.split('=')[1] }}"
  tags: xout_stop
  ignore_errors: true

