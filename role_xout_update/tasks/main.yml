---
- name: Load optional XOUT installation properties
  ansible.builtin.include_tasks: properties.yml

- name: Validate XOUT orchestration request
  ansible.builtin.include_tasks: validate.yml

- name: Build XOUT inventory topology
  ansible.builtin.include_tasks: topology.yml

- name: Resolve environment metadata from inventory
  ansible.builtin.set_fact:
    xout_effective_environment: >-
      {{
        xout_environment
        | default(hostvars[xout_target_hosts[0]].xout_environment | default('selected inventory'))
      }}
    xout_effective_kasse: >-
      {{
        kasse
        | default(hostvars[xout_target_hosts[0]].kasse | default(''))
      }}

- name: Verify xmanager execution layer
  ansible.builtin.include_tasks: verify_xmanager.yml

- name: Detect optional UDU delivery
  ansible.builtin.include_tasks: udu_check.yml
  when:
    - xout_action in ['plan', 'install', 'update']
    - xout_component | default('') | length == 0

- name: Show UDU planning result
  ansible.builtin.debug:
    msg: >-
      UDU: {{ 'manual installation required' if xout_udu_required | bool else 'not present for this delivery' }}
  when:
    - xout_action in ['plan', 'install', 'update']
    - xout_component | default('') | length == 0
    - xout_show_plan | bool

- name: Show isolated component planning note
  ansible.builtin.debug:
    msg: >-
      Isolated component mode: {{ xout_component }} only. UDU, Pegasus, Portal
      module lifecycle, CUPS and unrelated XOUT services are outside this operation.
  when:
    - xout_action in ['plan', 'update']
    - xout_component | default('') | length > 0
    - xout_show_plan | bool

- name: Show XOUT environment status
  ansible.builtin.include_tasks: status.yml
  when: xout_action == 'status'

- name: Build XOUT package plan
  ansible.builtin.include_tasks: package_plan.yml
  when: xout_action in ['plan', 'install', 'update']

- name: Reject missing packages in update mode
  ansible.builtin.include_tasks: update_precheck.yml
  when: xout_action == 'update'

- name: Detect whether update continues an already stopped maintenance window
  ansible.builtin.include_tasks: update_state.yml
  when:
    - xout_action == 'update'
    - xout_component | default('') | length == 0

- name: Validate install precondition
  ansible.builtin.include_tasks: install_precheck.yml
  when: xout_action == 'install'

- name: Calculate maintenance requirement
  ansible.builtin.set_fact:
    xout_maintenance_required: >-
      {{
        (xout_change_hosts | default([]) | length > 0)
        or (xout_udu_required | default(false) | bool)
        or (xout_environment_pre_stopped | default(false) | bool)
      }}
  when: xout_action in ['install', 'update']

- name: Execute full XOUT update workflow
  when:
    - xout_action == 'update'
    - xout_component | default('') | length == 0
    - xout_maintenance_required | bool
  block:
    - name: Disable Pegasus before maintenance
      ansible.builtin.include_tasks: pegasus.yml
      vars:
        xout_pegasus_active: 0

    - name: Quiesce Portal modules
      ansible.builtin.include_tasks: modules_quiesce.yml

    - name: Stop XOUT environment
      ansible.builtin.include_tasks: serviceflow_stop.yml

    - name: Wait for manual UDU installation
      ansible.builtin.include_tasks: udu_prompt.yml
      when: xout_udu_required | bool

    - name: Apply planned RPM changes
      ansible.builtin.include_tasks: package_apply.yml
      when: xout_change_hosts | length > 0

    - name: Ensure CUPS before XOUT start
      ansible.builtin.include_tasks: cups.yml

    - name: Start XOUT environment
      ansible.builtin.include_tasks: serviceflow_start.yml

    - name: Restore Portal module state
      ansible.builtin.include_tasks: modules_restore.yml

    - name: Enable Pegasus after successful start
      ansible.builtin.include_tasks: pegasus.yml
      vars:
        xout_pegasus_active: 1

    - name: Enforce disabled boot policy
      ansible.builtin.include_tasks: ensure_disabled.yml

- name: Execute isolated component update workflow
  when:
    - xout_action == 'update'
    - xout_component | default('') | length > 0
    - xout_maintenance_required | bool
  block:
    - name: Stop selected component only
      ansible.builtin.include_tasks: serviceflow_stop.yml
      vars:
        xout_lifecycle_services: "{{ xout_operation_serviceflow_services }}"

    - name: Apply selected component RPM changes
      ansible.builtin.include_tasks: package_apply.yml

    - name: Start selected component only
      ansible.builtin.include_tasks: serviceflow_start.yml
      vars:
        xout_lifecycle_services: "{{ xout_operation_serviceflow_services }}"

    - name: Verify isolated component result
      ansible.builtin.include_tasks: component_postcheck.yml
      when: xout_postcheck_enabled | bool

- name: Report update with no maintenance changes
  ansible.builtin.debug:
    msg: >-
      {{
        ('No RPM change was detected for component ' ~ xout_component ~ '. Its lifecycle was not changed.')
        if xout_component | default('') | length > 0
        else 'No RPM changes and no UDU delivery were detected. XOUT lifecycle was not changed.'
      }}
  when:
    - xout_action == 'update'
    - not xout_maintenance_required | bool

- name: Keep CUPS running after full update check
  ansible.builtin.include_tasks: cups.yml
  when:
    - xout_action == 'update'
    - xout_component | default('') | length == 0
    - not xout_maintenance_required | bool

- name: Execute XOUT install workflow
  when: xout_action == 'install'
  block:
    - name: Disable Pegasus before installation
      ansible.builtin.include_tasks: pegasus.yml
      vars:
        xout_pegasus_active: 0

    - name: Wait for manual UDU installation
      ansible.builtin.include_tasks: udu_prompt.yml
      when: xout_udu_required | bool

    - name: Apply planned RPM installation
      ansible.builtin.include_tasks: package_apply.yml
      when: xout_change_hosts | length > 0

    - name: Ensure CUPS before initial XOUT start
      ansible.builtin.include_tasks: cups.yml

    - name: Start installed XOUT environment
      ansible.builtin.include_tasks: serviceflow_start.yml

    - name: Restore any retained Portal module state
      ansible.builtin.include_tasks: modules_restore.yml

    - name: Enable Pegasus after successful installation
      ansible.builtin.include_tasks: pegasus.yml
      vars:
        xout_pegasus_active: 1

    - name: Enforce disabled boot policy
      ansible.builtin.include_tasks: ensure_disabled.yml

- name: Execute XOUT stop workflow
  when: xout_action == 'stop'
  block:
    - name: Disable Pegasus before stop
      ansible.builtin.include_tasks: pegasus.yml
      vars:
        xout_pegasus_active: 0

    - name: Stop XOUT environment
      ansible.builtin.include_tasks: serviceflow_stop.yml

    - name: Enforce disabled boot policy
      ansible.builtin.include_tasks: ensure_disabled.yml

- name: Execute XOUT start workflow
  when: xout_action == 'start'
  block:
    - name: Ensure CUPS before start
      ansible.builtin.include_tasks: cups.yml

    - name: Start XOUT environment
      ansible.builtin.include_tasks: serviceflow_start.yml

    - name: Restore retained Portal module state
      ansible.builtin.include_tasks: modules_restore.yml

    - name: Enable Pegasus after successful start
      ansible.builtin.include_tasks: pegasus.yml
      vars:
        xout_pegasus_active: 1

    - name: Enforce disabled boot policy
      ansible.builtin.include_tasks: ensure_disabled.yml

- name: Execute XOUT restart workflow
  when: xout_action == 'restart'
  block:
    - name: Disable Pegasus before restart
      ansible.builtin.include_tasks: pegasus.yml
      vars:
        xout_pegasus_active: 0

    - name: Quiesce Portal modules before restart
      ansible.builtin.include_tasks: modules_quiesce.yml

    - name: Stop XOUT environment
      ansible.builtin.include_tasks: serviceflow_stop.yml

    - name: Ensure CUPS before restart start-phase
      ansible.builtin.include_tasks: cups.yml

    - name: Start XOUT environment
      ansible.builtin.include_tasks: serviceflow_start.yml

    - name: Restore Portal modules after restart
      ansible.builtin.include_tasks: modules_restore.yml

    - name: Enable Pegasus after successful restart
      ansible.builtin.include_tasks: pegasus.yml
      vars:
        xout_pegasus_active: 1

    - name: Enforce disabled boot policy
      ansible.builtin.include_tasks: ensure_disabled.yml

- name: Mark successful full lifecycle for consolidated final postcheck
  ansible.builtin.set_fact:
    xout_run_consolidated_postcheck: true
  when:
    - xout_postcheck_enabled | bool
    - xout_component | default('') | length == 0
    - xout_action in ['install', 'update', 'start', 'restart']

- name: Show final XOUT status after standalone stop
  ansible.builtin.include_tasks: status.yml
  when: xout_action == 'stop'
