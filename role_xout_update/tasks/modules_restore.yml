---
- name: Check Portal module state files before restore
  ansible.builtin.stat:
    path: "{{ xout_module_state_file }}"
  delegate_to: "{{ item }}"
  loop: "{{ xout_portal_hosts }}"
  loop_control:
    label: "{{ item }}"
  register: xout_module_restore_states

- name: Wait until Portal Jolokia is available where state must be restored
  ansible.builtin.command:
    argv:
      - "{{ xout_python_path }}"
      - "{{ xout_manager_path }}"
      - --json
      - modules
  delegate_to: "{{ item.item }}"
  loop: "{{ xout_module_restore_states.results }}"
  loop_control:
    label: "{{ item.item }}"
  register: xout_jolokia_wait
  changed_when: false
  retries: 60
  delay: 2
  until: xout_jolokia_wait.rc == 0
  when: item.stat.exists

- name: Restore Portal modules and remove state file on success
  ansible.builtin.command:
    argv:
      - "{{ xout_python_path }}"
      - "{{ xout_manager_path }}"
      - --json
      - --non-interactive
      - "--max-wait={{ xout_manager_max_wait }}"
      - modules-restore
      - "--state-file={{ xout_module_state_file }}"
  delegate_to: "{{ item.item }}"
  loop: "{{ xout_module_restore_states.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists
  changed_when: true
