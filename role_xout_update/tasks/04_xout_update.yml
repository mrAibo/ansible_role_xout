  command: sudo zypper -n --no-gpg-checks update --download-as-needed -t package xout-web
  when: "'web' in group_names or 'tobi' in group_names"

- name: Start XOUT Web Systemd Service
  shell: sudo systemctl start xout-web
  args:
    executable: /bin/bash
  become: yes
  become_user: xout-adm
  when: "'web' in group_names"
  tags: xout_start

- name: Update xout-batchsplitter package if installed
  command: sudo zypper -n --no-gpg-checks update --download-as-needed -t package xout-batchsplitter
  when: "'batchsplitter' in group_names"

- name: Start XOUT Web Systemd Service
  shell: sudo systemctl start xout-batchsplitter
  args:
    executable: /bin/bash
  become: yes
  become_user: xout-adm
  when: "'batchsplitter' in group_names"
  tags: xout_start

