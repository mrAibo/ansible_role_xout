---
- name: Detect direct host package preflight
  ansible.builtin.set_fact:
    xout_direct_preflight_available: >-
      {{
        xout_operation_hosts | length > 0
        and hostvars[xout_operation_hosts[0]].xout_preflight_plan is defined
      }}

- name: Aggregate direct host package preflight
  ansible.builtin.include_tasks: package_plan_from_hostvars.yml
  when: xout_direct_preflight_available | bool

- name: Use legacy delegated package preflight fallback
  ansible.builtin.include_tasks: package_plan_legacy.yml
  when: not xout_direct_preflight_available | bool
