---
- name: Ensure managed XOUT components remain disabled for boot autostart
  ansible.builtin.command:
    argv:
      - "{{ xout_python_path }}"
      - "{{ xout_manager_path }}"
      - --json
      - --non-interactive
      - "--lock-file={{ xout_manager_lock_file }}"
      - ensure-disabled
      - "{{ item.1 }}"
  delegate_to: "{{ item.0.key }}"
  loop: "{{ xout_host_packages | dict2items | subelements('value') }}"
  loop_control:
    label: "{{ item.0.key }} / {{ item.1 }}"
  when: item.1 not in (xout_boot_disable_exempt_components | default([]))
  register: xout_disable_boot_policy
  changed_when: false
  failed_when:
    - xout_action != 'stop'
    - xout_disable_boot_policy.rc != 0

- name: Report boot-autostart policy exemptions
  ansible.builtin.debug:
    msg: >-
      Boot autostart policy exception: {{ item.1 }} on {{ item.0.key }} may
      remain enabled by configuration.
  loop: "{{ xout_host_packages | dict2items | subelements('value') }}"
  loop_control:
    label: "{{ item.0.key }} / {{ item.1 }}"
  when:
    - item.1 in (xout_boot_disable_exempt_components | default([]))
    - xout_show_plan | bool

- name: Warn about boot autostart that could not be disabled after standalone stop
  ansible.builtin.debug:
    msg: >-
      WARNING: Boot autostart could not be disabled for {{ item.item.1 }} on
      {{ item.item.0.key }}. XOUT services were already stopped; review
      sudoers/boot policy before a reboot. Detail: {{
      item.stderr | default(item.stdout | default('')) | trim }}
  loop: "{{ xout_disable_boot_policy.results | default([]) }}"
  loop_control:
    label: >-
      {{
        (item.item.0.key ~ ' / ' ~ item.item.1)
        if item.item is defined
        else 'unknown target'
      }}
  when:
    - xout_action == 'stop'
    - not (item.skipped | default(false) | bool)
    - item.rc | default(0) != 0
