---
- name: Verify xmanager 3.x on operation hosts
  ansible.builtin.command:
    argv:
      - "{{ xout_python_path }}"
      - "{{ xout_manager_path }}"
      - --version
  delegate_to: "{{ item }}"
  loop: "{{ xout_operation_hosts }}"
  loop_control:
    label: "{{ item }}"
  changed_when: false
  register: xout_manager_version_results
  failed_when:
    - xout_manager_version_results.rc != 0 or 'xmanager.py 3.' not in xout_manager_version_results.stdout
  when:
    - xout_action != 'status'
    - >-
      not (
        xout_action in ['plan', 'install', 'update']
        and xout_operation_hosts | length > 0
        and hostvars[xout_operation_hosts[0]].xout_preflight_plan is defined
      )
